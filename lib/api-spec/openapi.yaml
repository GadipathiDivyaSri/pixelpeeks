openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: PixelPeek steganography studio API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: steganography
  - name: analysis
  - name: history
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /encode:
    post:
      operationId: encodeFile
      tags: [steganography]
      summary: Hide a message in a carrier file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/EncodeInput"
      responses:
        "200":
          description: Encoded file download
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncodeResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /decode:
    post:
      operationId: decodeFile
      tags: [steganography]
      summary: Reveal a hidden message from a carrier file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DecodeInput"
      responses:
        "200":
          description: Decoded message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecodeResult"
        "400":
          description: No message found or wrong key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /detect:
    post:
      operationId: detectSteganography
      tags: [analysis]
      summary: Analyze a file for hidden content
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DetectInput"
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectResult"
        "400":
          description: Unsupported file type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stats:
    get:
      operationId: getStats
      tags: [history]
      summary: Get operation statistics
      responses:
        "200":
          description: Statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"

  /events:
    get:
      operationId: listEvents
      tags: [history]
      summary: List recent operations
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    RegisterBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
      required: [name, email, password]

    LoginBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    AuthResult:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserProfile"
      required: [token, user]

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, name, email, createdAt]

    EncodeInput:
      type: object
      properties:
        file:
          type: string
          format: binary
        message:
          type: string
        key:
          type: string
      required: [file, message]

    EncodeResult:
      type: object
      properties:
        downloadUrl:
          type: string
        filename:
          type: string
        carrier:
          type: string
          enum: [image, audio, video]
        bytesUsed:
          type: integer
        totalBytes:
          type: integer
        timeSec:
          type: number
      required: [downloadUrl, filename, carrier, bytesUsed, totalBytes, timeSec]

    DecodeInput:
      type: object
      properties:
        file:
          type: string
          format: binary
        key:
          type: string
      required: [file]

    DecodeResult:
      type: object
      properties:
        message:
          type: string
        carrier:
          type: string
          enum: [image, audio, video]
        encrypted:
          type: boolean
      required: [message, carrier, encrypted]

    DetectInput:
      type: object
      properties:
        file:
          type: string
          format: binary
      required: [file]

    DetectResult:
      type: object
      properties:
        verdict:
          type: string
          enum: [CLEAN, SUSPECT, STEGO]
        probability:
          type: number
        carrier:
          type: string
          enum: [image, audio, video]
        features:
          $ref: "#/components/schemas/StegoFeatures"
      required: [verdict, probability, carrier, features]

    StegoFeatures:
      type: object
      properties:
        entropy:
          type: number
        lsbRatio:
          type: number
        lsbDeviation:
          type: number
        chiSquare:
          type: number
        blockLsbStdev:
          type: number
      required: [entropy, lsbRatio, lsbDeviation, chiSquare, blockLsbStdev]

    Stats:
      type: object
      properties:
        totalOps:
          type: integer
        encodes:
          type: integer
        decodes:
          type: integer
        peeks:
          type: integer
        stegoHits:
          type: integer
      required: [totalOps, encodes, decodes, peeks, stegoHits]

    Event:
      type: object
      properties:
        id:
          type: integer
        operation:
          type: string
          enum: [encode, decode, detect]
        carrier:
          type: string
          enum: [image, audio, video]
        filename:
          type: string
        verdict:
          type: ["string", "null"]
          enum: [CLEAN, SUSPECT, STEGO, null]
        failed:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, operation, carrier, filename, failed, createdAt]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
